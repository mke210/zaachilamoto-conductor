    <style>
        :root{--bg:#0a0a0f;--bg2:#13111a;--card:#1a1722;--acc:#6C5CE7;--green:#00C897;--red:#FF4757;--warn:#FFA502;--txt:#fff;--txt2:#aaa;--txt3:#666;--bd:#252130;--r:12px;--r2:18px}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter','Segoe UI',sans-serif;background:#000;color:var(--txt);height:100vh;overflow:hidden}
        .app{max-width:430px;margin:0 auto;height:100vh;background:var(--bg);display:flex;flex-direction:column}
        @media(min-width:431px){body{display:flex;justify-content:center;align-items:center;padding:20px}.app{border-radius:30px;height:90vh;max-height:800px;box-shadow:0 0 50px rgba(108,92,231,.1)}}
        .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:2rem;text-align:center}
        .login-screen .logo{font-size:5rem;margin-bottom:.5rem}
        .login-screen h1{font-size:1.5rem;margin-bottom:.3rem}.login-screen h1 span{color:var(--acc)}
        .login-screen .subtitle{font-size:.8rem;color:var(--txt3);margin-bottom:1.5rem;background:rgba(108,92,231,.15);padding:.3rem 1rem;border-radius:12px;display:inline-block}
        .inp{width:100%;max-width:300px;padding:.7rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:var(--txt);margin-bottom:.5rem;outline:0;font-size:.85rem}.inp:focus{border-color:var(--acc)}
        .btn{width:100%;max-width:300px;padding:.7rem;border-radius:var(--r);font-weight:700;cursor:pointer;border:0;font-size:.85rem}.btn-acc{background:var(--acc);color:#fff}.btn-acc:disabled{opacity:.5}
        .login-err{background:rgba(255,71,87,.1);border:1px solid var(--red);padding:.5rem;border-radius:var(--r);margin-bottom:.5rem;font-size:.75rem;display:none;max-width:300px;width:100%}
        .dashboard{display:none;flex-direction:column;height:100%}.dashboard.active{display:flex}
        .topbar{background:linear-gradient(135deg,var(--acc),#4834d4);padding:.5rem .8rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50;box-shadow:0 4px 15px rgba(108,92,231,.3)}
        .topbar-brand{display:flex;align-items:center;gap:.4rem}
        .topbar-logo{width:30px;height:30px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem}
        .topbar h2{font-size:.85rem;line-height:1.1}.topbar h2 span{font-size:.55rem;opacity:.8;display:block;font-weight:400}
        .topbar-right{display:flex;gap:.4rem;align-items:center}
        .toggle{padding:.3rem .6rem;border-radius:15px;font-size:.65rem;font-weight:700;cursor:pointer;border:0}.toggle.on{background:var(--green);color:#000}.toggle.off{background:var(--red);color:#fff}
        .btn-sm{padding:.3rem .6rem;border-radius:8px;font-size:.65rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer}
        .notification-container{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;width:90%;max-width:400px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
        .notification{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:notifIn .4s ease,notifOut .4s ease 3s forwards;pointer-events:auto}
        .notification.request{border-left:3px solid var(--acc)}.notification.message{border-left:3px solid var(--green)}.notification.success{border-left:3px solid var(--green)}.notification.error{border-left:3px solid var(--red)}
        .notif-icon{font-size:1.3rem;flex-shrink:0}.notif-content{flex:1}.notif-title{font-size:.75rem;font-weight:700}.notif-text{font-size:.65rem;color:var(--txt2)}
        .notif-close{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:.8rem}
        @keyframes notifIn{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes notifOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}
        .notif-dot{width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:.55rem;font-weight:700;display:none;align-items:center;justify-content:center}.notif-dot.show{display:flex}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .map-wrap{flex:0 0 180px;position:relative}#driverMap{width:100%;height:100%;position:absolute;top:0;left:0}
        .tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0}.tab{flex:1;text-align:center;padding:.5rem;font-size:.7rem;font-weight:600;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
        .content{flex:1;overflow-y:auto;padding:.6rem;-webkit-overflow-scrolling:touch}
        .incoming{background:linear-gradient(135deg,#1a1a2e,#211d2a);border:2px solid var(--acc);border-radius:var(--r2);padding:.8rem;animation:pop .3s ease}@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
        .inc-header{font-size:.9rem;font-weight:700;color:var(--acc);margin-bottom:.5rem}.inc-row{display:flex;justify-content:space-between;font-size:.7rem;padding:.2rem 0;color:var(--txt2)}.inc-row b{color:var(--txt)}.inc-btns{display:flex;gap:.4rem;margin-top:.6rem}
        .btn-accept{flex:1;padding:.6rem;background:var(--green);color:#000;border:0;border-radius:var(--r);font-weight:700;cursor:pointer;font-size:.75rem}.btn-deny{flex:1;padding:.6rem;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--r);font-weight:700;cursor:pointer;font-size:.75rem}
        .ride-step{display:flex;align-items:center;gap:.5rem;padding:.5rem;background:var(--card);border-radius:var(--r);margin-bottom:.3rem;border:1px solid var(--bd)}.ride-step .num{width:28px;height:28px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0}.ride-step .num.done{background:var(--green)}.ride-step .num.now{background:var(--acc);animation:pulse 1.5s infinite}.ride-step .info{flex:1;font-size:.7rem}.ride-step .addr{font-size:.6rem;color:var(--txt3)}
        .btn-full{width:100%;padding:.6rem;border-radius:var(--r);font-weight:700;font-size:.75rem;cursor:pointer;border:0;margin-top:.3rem}.btn-purple{background:var(--acc);color:#fff}.btn-outline{background:transparent;border:1px solid var(--bd);color:var(--txt2);position:relative}.btn-red{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.3)}
        .badge-new{background:var(--red);color:#fff;padding:2px 6px;border-radius:10px;font-size:.55rem;font-weight:700;display:none;animation:pulse 1.5s infinite;position:absolute;top:-6px;right:-6px}.badge-new.show{display:inline-block}
        .chat-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;flex-direction:column}.chat-header{background:linear-gradient(135deg,var(--acc),#4834d4);padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between}.chat-body{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.5rem}.msg{max-width:80%;padding:.5rem .7rem;border-radius:14px;font-size:.75rem}.msg.sent{background:var(--acc);align-self:flex-end}.msg.recv{background:var(--card);align-self:flex-start;border:1px solid var(--bd)}.chat-input-wrap{padding:.5rem;display:flex;gap:.3rem;border-top:1px solid var(--bd);background:var(--bg2)}.chat-input-wrap input{flex:1;padding:.5rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:var(--txt);outline:0;font-size:.75rem}.chat-input-wrap button{padding:.5rem .8rem;background:var(--acc);color:#fff;border:0;border-radius:var(--r);font-weight:700;cursor:pointer}
        .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:.7rem;margin-bottom:.4rem}.card-row{display:flex;justify-content:space-between;align-items:center}.card-val{font-size:1.3rem;font-weight:800}.card-lbl{font-size:.6rem;color:var(--txt3)}
        .empty{text-align:center;color:var(--txt3);padding:1rem;font-size:.75rem}.stars{display:flex;gap:.2rem}.stars span{color:var(--warn);font-size:.7rem}
    </style>
</head>
<body>
<div class="app">
    <!-- LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="logo">🛺</div>
        <h1>Zaachila <span>Moto</span></h1>
        <div class="subtitle">Chofer</div>
        <div class="login-err" id="loginError"></div>
        <input type="email" id="loginEmail" class="inp" placeholder="Correo electrónico">
        <input type="password" id="loginPassword" class="inp" placeholder="Contraseña">
        <button class="btn btn-acc" id="btnLogin" onclick="login()">Iniciar Sesión</button>
        <p style="font-size:.65rem;color:var(--txt3);margin-top:.8rem">¿Olvidaste tu contraseña? Contacta al administrador</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <header class="topbar">
            <div class="topbar-brand">
                <div class="topbar-logo">🛺</div>
                <h2>Zaachila Moto<span>Chofer</span></h2>
            </div>
            <div class="topbar-right">
                <span class="notif-dot" id="notificationDot">0</span>
                <button class="toggle on" id="statusToggle" onclick="toggleStatus()">ACTIVO</button>
                <button class="btn-sm" onclick="logout()">Salir</button>
            </div>
        </header>
        <div class="map-wrap"><div id="driverMap"></div></div>
        <div class="tabs"><div class="tab on" onclick="switchTab('home',this)">🏠 Inicio</div><div class="tab" onclick="switchTab('earnings',this)">💰 Ganancias</div><div class="tab" onclick="switchTab('history',this)">📋 Historial</div></div>
        <div class="content" id="tabContent">
            <div id="tab-home"><div id="idleView"><div class="empty">🟢 Disponible para recibir solicitudes</div></div><div id="incomingView" style="display:none"></div><div id="activeView" style="display:none"></div></div>
            <div id="tab-earnings" style="display:none"><div class="card"><div class="card-lbl">HOY</div><div class="card-val" id="earnToday">$0</div></div><div class="card"><div class="card-lbl">SEMANA</div><div class="card-val" id="earnWeek">$0</div></div><div class="card"><div class="card-row"><div><div class="card-lbl">⭐ CALIFICACIÓN</div><div class="card-val" id="earnRating">0</div></div><div class="stars" id="starsDisplay"></div></div></div></div>
            <div id="tab-history" style="display:none"><div id="historyList"><div class="empty">Cargando...</div></div></div>
        </div>
    </div>
</div>
<script>
const fb={apiKey:"AIzaSyCBXBPMz2OZ3U2KfTaU-uHCBhwmbnR7O40",authDomain:"zaachilamoto.firebaseapp.com",databaseURL:"https://zaachilamoto-default-rtdb.firebaseio.com",projectId:"zaachilamoto",storageBucket:"zaachilamoto.firebasestorage.app",messagingSenderId:"559788509526",appId:"1:559788509526:web:c751d8d22068f09041aef7"};
firebase.initializeApp(fb);const auth=firebase.auth(),db=firebase.database(),storage=firebase.storage();
let map,marker,uid,sid,sdata,step=1,active=true,pos={lat:16.9516,lng:-96.7491},chatOpen=false,calif=0,notifC=0,svcAct=false,confAct=false;const ZA=[16.9516,-96.7491];
function notif(t,m,ty='message'){notifC++;updateDot();playSound(ty==='request'?'incoming':ty==='message'?'msg':'accept');let c=document.getElementById('notificationContainer');if(!c){c=document.createElement('div');c.id='notificationContainer';c.className='notification-container';document.body.appendChild(c)}const n=document.createElement('div');n.className=`notification ${ty}`;n.innerHTML=`<span class="notif-icon">${ty==='request'?'🔔':ty==='message'?'💬':ty==='error'?'❌':'✅'}</span><div class="notif-content"><div class="notif-title">${t}</div><div class="notif-text">${m}</div></div><button class="notif-close" onclick="dismissN(this)">✕</button>`;c.appendChild(n);setTimeout(()=>{if(n.parentNode){n.remove();notifC--;updateDot()}},3500)}
function dismissN(b){const n=b.closest('.notification');if(n){n.style.animation='notifOut .3s ease forwards';setTimeout(()=>{n.remove();notifC--;updateDot()},300)}}
function updateDot(){const d=document.getElementById('notificationDot');if(d){d.textContent=notifC;if(notifC>0)d.classList.add('show');else d.classList.remove('show')}}
function playSound(t){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(t==='incoming'){o.frequency.value=800;g.gain.value=.3;o.start();o.stop(c.currentTime+.3)}else if(t==='accept'){o.frequency.value=600;g.gain.value=.2;o.start();o.stop(c.currentTime+.2)}else if(t==='msg'){o.frequency.value=1000;g.gain.value=.15;o.start();o.stop(c.currentTime+.1)}}catch(e){}}
function login(){const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPassword').value,err=document.getElementById('loginError'),btn=document.getElementById('btnLogin');if(!e||!p){err.textContent='Completa los campos';err.style.display='block';return}btn.disabled=true;btn.textContent='...';err.style.display='none';auth.signInWithEmailAndPassword(e,p).then(u=>{uid=u.user.uid;localStorage.setItem('ce',e);localStorage.setItem('cp',p);return db.ref(`choferes/${uid}`).once('value')}).then(s=>{if(!s.val())return db.ref(`choferes/${uid}`).set({nombre:e.split('@')[0],email:e,estado:'activo',calificacion:0,total_servicios:0,servicios_hoy:0,ubicacion:{lat:ZA[0],lng:ZA[1]}})}).then(()=>{document.getElementById('loginScreen').style.display='none';document.getElementById('dashboard').classList.add('active');setTimeout(()=>{initMap();loadData();listenSvc();getPos();listenChats();listenGlobal()},300);notif('Bienvenido','Sesión iniciada como Chofer','success')}).catch(er=>{let m='Error';if(er.code==='auth/user-not-found')m='Chofer no registrado';else if(er.code==='auth/wrong-password')m='Contraseña incorrecta';err.textContent=m;err.style.display='block';btn.disabled=false;btn.textContent='Iniciar Sesión'})}
function logout(){if(confirm('¿Cerrar sesión?')){if(uid)db.ref(`choferes/${uid}`).update({estado:'inactivo'});auth.signOut();localStorage.clear();location.reload()}}
window.addEventListener('DOMContentLoaded',()=>{const e=localStorage.getItem('ce'),p=localStorage.getItem('cp');if(e&&p){document.getElementById('loginEmail').value=e;document.getElementById('loginPassword').value=p;login()}});
function initMap(){const c=document.getElementById('driverMap');if(!c||c.offsetHeight===0)c.style.height='180px';map=L.map('driverMap',{zoomControl:false,attributionControl:false}).setView(ZA,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);marker=L.marker(ZA,{icon:L.divIcon({html:'<div style="background:#6C5CE7;width:14px;height:14px;border-radius:50%;border:3px solid #fff;"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);setTimeout(()=>map.invalidateSize(),300)}
function getPos(){if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};if(marker)marker.setLatLng([pos.lat,pos.lng]);if(uid&&active)db.ref(`choferes/${uid}/ubicacion`).set({lat:pos.lat,lng:pos.lng,ts:firebase.database.ServerValue.TIMESTAMP})},()=>{},{enableHighAccuracy:true})}
function loadData(){if(!uid)return;db.ref(`choferes/${uid}`).on('value',s=>{const d=s.val()||{};document.getElementById('choferName')?document.getElementById('choferName').textContent=(d.nombre||'Chofer').split(' ')[0]:null;const hoy=new Date().toISOString().split('T')[0],g=d.ganancias||{};document.getElementById('earnToday').textContent='$'+(g[hoy]||0);document.getElementById('earnWeek').textContent='$'+Math.round((g[hoy]||0)*5);calif=d.calificacion||0;document.getElementById('earnRating').textContent='⭐ '+calif;document.getElementById('starsDisplay').innerHTML=Array.from({length:5},(_,i)=>`<span>${i<Math.round(calif)?'★':'☆'}</span>`).join('')})}
function toggleStatus(){active=!active;const b=document.getElementById('statusToggle');if(active){b.className='toggle on';b.textContent='ACTIVO';if(uid)db.ref(`choferes/${uid}`).update({estado:'activo'});notif('Disponible','Recibiendo solicitudes','success')}else{b.className='toggle off';b.textContent='INACTIVO';if(uid)db.ref(`choferes/${uid}`).update({estado:'inactivo'});document.getElementById('incomingView').style.display='none';document.getElementById('idleView').style.display='block';notif('Pausado','Servicios detenidos','error')}}
function listenSvc(){db.ref('servicios').orderByChild('estado').equalTo('buscando').limitToLast(1).on('child_added',s=>{if(active&&!sid&&!svcAct){svcAct=true;db.ref(`servicios/${s.key}/estado`).once('value',es=>{if(es.val()==='buscando'){sid=s.key;sdata=s.val();showInc()}else{svcAct=false}})}})}
function listenGlobal(){db.ref('servicios').on('child_changed',s=>{const v=s.val();if(s.key===sid&&v.estado==='aceptado'&&v.choferId!==uid){document.getElementById('incomingView').style.display='none';document.getElementById('activeView').style.display='none';document.getElementById('idleView').style.display='block';notif('Servicio asignado','Otro chofer fue elegido','error');resetAll()}if(s.key===sid&&v.estado==='tarifa_propuesta'&&v.choferId!==uid){document.getElementById('incomingView').style.display='none';document.getElementById('idleView').style.display='block';notif('No disponible','Otro chofer envió tarifa','error');resetAll()}})}
function showInc(){notif('Nueva solicitud','Cliente cerca','request');if(navigator.vibrate)navigator.vibrate([200,100,200]);document.getElementById('idleView').style.display='none';document.getElementById('incomingView').style.display='block';document.getElementById('incomingView').innerHTML=`<div class="incoming"><div class="inc-header">🔔 Nueva solicitud</div><div class="inc-row"><span>Origen</span><b>${sdata?.origen?.direccion||'Cliente'}</b></div><div class="inc-row"><span>Destino</span><b>${sdata?.destino?.direccion||'---'}</b></div><div class="inc-row"><span>Distancia</span><b>${calcDist(pos.lat,pos.lng,sdata?.origen?.lat||ZA[0],sdata?.origen?.lng||ZA[1]).toFixed(1)} km</b></div><div class="inc-btns"><button class="btn-accept" onclick="accept()">Aceptar</button><button class="btn-deny" onclick="deny()">Rechazar</button></div></div>`}
function accept(){if(!sid||!sdata)return;db.ref(`servicios/${sid}/estado`).once('value',es=>{if(es.val()!=='buscando'){toast('Ya no disponible');document.getElementById('incomingView').style.display='none';document.getElementById('idleView').style.display='block';resetAll();return}const price=prompt('💰 Tarifa a cobrar ($):','50');if(!price||isNaN(price)||parseInt(price)<=0){toast('Tarifa inválida');return}const fare=parseInt(price);if(sdata)sdata.tarifa_propuesta=fare;svcAct=false;db.ref(`choferes/${uid}`).once('value',snap=>{const ch=snap.val()||{};db.ref(`servicios/${sid}`).update({choferId:uid,estado:'tarifa_propuesta',tarifa_propuesta:fare,choferNombre:ch.nombre||'Chofer',choferPlaca:ch.placa||'---',choferColor:ch.color||'No especificado',choferUnidad:ch.unidad||'No especificado',choferTelefono:ch.telefono||'No especificado',choferRating:String(calif),ts:firebase.database.ServerValue.TIMESTAMP}).then(()=>{document.getElementById('incomingView').style.display='none';document.getElementById('idleView').style.display='block';notif('Tarifa enviada','$'+fare,'success');if(!confAct){confAct=true;listenConfirm(sid)}}).catch(()=>{toast('Error');svcAct=false})})})}
function listenConfirm(id){db.ref(`servicios/${id}/estado`).once('value',s=>handleSt(s.val()));db.ref(`servicios/${id}/estado`).on('value',s=>handleSt(s.val()))}
function handleSt(st){if(st==='aceptado'){if(document.getElementById('activeView').style.display==='none'){showAct();notif('Aceptado','Cliente aceptó','success');playSound('accept')}}else if(st==='cancelado'){resetAll();notif('Cancelado','Cliente rechazó','error')}}
function deny(){if(!sid)return;svcAct=false;db.ref(`servicios/${sid}`).update({estado:'rechazado',choferId:uid,ts:firebase.database.ServerValue.TIMESTAMP}).then(()=>{document.getElementById('incomingView').style.display='none';document.getElementById('idleView').style.display='block';resetAll();notif('Rechazado','Servicio rechazado','error')})}
function resetAll(){if(sid){db.ref(`servicios/${sid}/estado`).off();db.ref(`servicios/${sid}`).off()}sid=null;sdata=null;svcAct=false;confAct=false}
function showAct(){document.getElementById('idleView').style.display='none';document.getElementById('incomingView').style.display='none';document.getElementById('activeView').style.display='block';step=1;updateUI()}
function updateUI(){document.getElementById('activeView').innerHTML=`<div class="ride-step"><div class="num ${step===1?'now':step>1?'done':''}">1</div><div class="info"><div>Recoger cliente</div><div class="addr">${sdata?.origen?.direccion||'Cliente'}</div></div></div><div class="ride-step"><div class="num ${step===2?'now':step>2?'done':''}">2</div><div class="info"><div>Llevar a destino</div><div class="addr">${sdata?.destino?.direccion||'Destino'}</div></div></div><button class="btn-full btn-purple" onclick="nextStep()">${step===1?'Iniciar Recogida':step===2?'Llegué al Cliente':'Finalizar Viaje'}</button><button class="btn-full btn-outline" onclick="openChat()" style="position:relative">💬 Chat <span class="badge-new" id="chatBadge">0</span></button><button class="btn-full btn-outline" onclick="reportFound()">📦 Reportar objeto</button><button class="btn-full btn-red" onclick="finishNow()">🏁 Finalizar ahora</button>`}
function nextStep(){if(step===1){db.ref(`servicios/${sid}`).update({estado:'en_camino'});step=2;updateUI();notif('En camino','Al cliente','success')}else if(step===2){db.ref(`servicios/${sid}`).update({estado:'en_servicio'});step=3;updateUI();notif('Viaje iniciado','Al destino','success')}else finishRide()}
function finishRide(){if(!sid)return;db.ref(`servicios/${sid}/tarifa_propuesta`).once('value',snap=>{const fare=snap.val()||sdata?.tarifa_propuesta||50;const hoy=new Date().toISOString().split('T')[0];if(sid){db.ref(`servicios/${sid}/estado`).off();db.ref(`servicios/${sid}`).off()}db.ref(`servicios/${sid}`).update({estado:'completado',cobro:fare,fecha:hoy});db.ref(`choferes/${uid}/ganancias/${hoy}`).transaction(g=>(g||0)+fare);db.ref(`choferes/${uid}/servicios_hoy`).transaction(c=>(c||0)+1);db.ref(`choferes/${uid}/total_servicios`).transaction(c=>(c||0)+1);db.ref('admin/comisiones').push({servicioId:sid,choferId:uid,monto_servicio:fare,comision:Math.round(fare*.1),fecha:hoy});resetAll();step=1;document.getElementById('activeView').style.display='none';document.getElementById('idleView').style.display='block';notif('Viaje completado','$'+fare,'success');loadData();loadHistory()})}
function finishNow(){if(!sid)return;if(step<=2){db.ref(`servicios/${sid}`).update({estado:'cancelado_chofer',motivo:'Chofer canceló antes de recoger',ts:firebase.database.ServerValue.TIMESTAMP}).then(()=>{resetAll();step=1;document.getElementById('activeView').style.display='none';document.getElementById('idleView').style.display='block';notif('Viaje cancelado','Se notificó al cliente','error');loadHistory()})}else{step=3;finishRide()}}
function reportFound(){if(!sid)return;const d=prompt('Describe el objeto:');if(!d)return;if(confirm('¿Subir foto?')){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){const f=i.files[0];if(f){const r=storage.ref(`objetos/${sid}_${Date.now()}`);r.put(f).then(()=>r.getDownloadURL()).then(u=>{db.ref('reportes/objetos_olvidados').push({servicioId:sid,choferId:uid,descripcion:d,foto:u,estado:'pendiente',tipo:'chofer_reporta',timestamp:firebase.database.ServerValue.TIMESTAMP});notif('Reporte','Con foto','success')}).catch(()=>saveR(d))}};i.click()}else saveR(d)}
function saveR(d){db.ref('reportes/objetos_olvidados').push({servicioId:sid,choferId:uid,descripcion:d,estado:'pendiente',tipo:'chofer_reporta',timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>notif('Reporte','Enviado','success'))}
function listenChats(){db.ref('chats').on('child_added',s=>{if(s.key===sid&&!chatOpen){const ms=s.val();if(!ms)return;const l=Object.values(ms).pop();if(l&&l.remitente==='cliente'){const b=document.getElementById('chatBadge');if(b){let c=parseInt(b.textContent)||0;c++;b.textContent=c;b.classList.add('show')}notif('💬 Nuevo mensaje',l.mensaje.substring(0,35),'message');playSound('msg');if(navigator.vibrate)navigator.vibrate([200,100,200,100,200])}}})}
function openChat(){if(!sid)return;chatOpen=true;const b=document.getElementById('chatBadge');if(b){b.classList.remove('show');b.textContent='0'}const d=document.createElement('div');d.className='chat-modal';d.innerHTML=`<div class="chat-header"><span>💬 Chat con el cliente</span><button onclick="closeChat(this)" style="background:none;border:none;color:var(--txt);font-size:1.2rem;cursor:pointer">✕</button></div><div class="chat-body" id="chatMsgs"></div><div class="chat-input-wrap"><input type="text" id="chatInput" placeholder="Escribe..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Enviar</button></div>`;document.body.appendChild(d);db.ref(`chats/${sid}`).on('child_added',s=>{const m=s.val();const el=document.getElementById('chatMsgs');if(el){el.innerHTML+=`<div class="msg ${m.remitente==='chofer'?'sent':'recv'}">${m.mensaje}</div>`;el.scrollTop=el.scrollHeight}})}
function closeChat(b){b.closest('.chat-modal').remove();chatOpen=false}
window.sendMsg=function(){const i=document.getElementById('chatInput');const m=i?.value.trim();if(m&&sid){db.ref(`chats/${sid}`).push({remitente:'chofer',userId:uid,mensaje:m,ts:firebase.database.ServerValue.TIMESTAMP});i.value=''}}
function loadHistory(){if(!uid)return;db.ref('servicios').orderByChild('choferId').equalTo(uid).limitToLast(20).once('value',s=>{const d=s.val();let h='';if(!d){document.getElementById('historyList').innerHTML='<div class="empty">Sin servicios</div>';return}Object.entries(d).reverse().forEach(([id,v])=>{h+=`<div class="card"><div class="card-row"><div><div style="font-weight:700;font-size:.75rem">${(v.origen?.direccion||'').substring(0,15)} → ${(v.destino?.direccion||'').substring(0,15)}</div><div style="font-size:.6rem;color:var(--txt3)">${v.fecha||'-'} · ${v.estado}</div></div><div style="font-weight:700;color:var(--green)">$${v.cobro||v.tarifa_estimada||0}</div></div></div>`});document.getElementById('historyList').innerHTML=h})}
function switchTab(n,el){document.querySelectorAll('#tabContent > div').forEach(d=>d.style.display='none');document.getElementById('tab-'+n).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');if(n==='earnings')loadData();if(n==='history')loadHistory()}
function calcDist(l1,l2,lo1,lo2){const R=6371,dLa=(l2-l1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;return R*2*Math.atan2(Math.sqrt(Math.sin(dLa/2)**2+Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLo/2)**2),Math.sqrt(1-Math.sin(dLa/2)**2-Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLo/2)**2))}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
document.addEventListener('keypress',e=>{if(e.key=='Enter'&&document.getElementById('loginScreen').style.display!=='none')login()});
window.addEventListener('resize',()=>{if(map)setTimeout(()=>map.invalidateSize(),200)});
</script>
</body>
